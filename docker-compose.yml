version: '3.8'

services:
  # 1. Apache Kafka Message Broker (KRaft mode, zero-Zookeeper)
  kafka:
    image: apache/kafka:3.7.0
    container_name: midas-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Companion Incentive Microservice
  incentive-service:
    image: eclipse-temurin:17-jre-jammy
    container_name: midas-incentive-service
    volumes:
      - ./services/transaction-incentive-api.jar:/app/incentive-api.jar:ro
    ports:
      - "8080:8080"
    working_dir: /app
    command: ["java", "-jar", "incentive-api.jar"]
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. MidasCore Central Transaction Processing Engine
  midas-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: midas-core-app
    ports:
      - "33400:33400"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INCENTIVE_API_URL: http://incentive-service:8080/incentive
    depends_on:
      kafka:
        condition: service_healthy
      incentive-service:
        condition: service_started
