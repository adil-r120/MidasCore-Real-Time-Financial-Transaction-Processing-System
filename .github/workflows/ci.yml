name: MidasCore CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permissions to Maven Wrapper
        run: chmod +x mvnw

      - name: Compile & Package Application
        run: ./mvnw clean package -DskipTests

      - name: Verify Build Artifact
        run: ls -lh target/midas-core-1.0.0.jar
